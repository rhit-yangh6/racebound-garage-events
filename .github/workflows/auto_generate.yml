name: Auto-generate upcoming weeks

on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday at 12:00 UTC
  workflow_dispatch: {}    # allows a manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python auto_generate.py
      - run: |
          git config user.name "racebound-events-bot"
          git config user.email "actions@github.com"
          git add global_events.json
          if git diff --cached --quiet; then
            echo "Nothing staged — auto_generate.py made no changes."
          else
            git commit -m "Auto-generate upcoming week(s)"
            git push
          fi
