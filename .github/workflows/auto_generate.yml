name: Auto-generate upcoming weeks

on:
  schedule:
    # Every Wednesday 21:00 UTC — 3 hours before the actual weekly reset.
    # GlobalEvent.week_index() boundaries always land on Thursday 00:00 UTC
    # (an artifact of the raw Unix-epoch week math), so this keeps the
    # window topped up right before each new week goes live rather than on
    # an arbitrary day mid-week.
    - cron: "0 21 * * 3"
  workflow_dispatch: {}    # allows a manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python auto_generate.py
      - run: |
          git config user.name "racebound-events-bot"
          git config user.email "actions@github.com"
          git add global_events.json
          if git diff --cached --quiet; then
            echo "Nothing staged — auto_generate.py made no changes."
          else
            git commit -m "Auto-generate upcoming week(s)"
            git push
          fi
